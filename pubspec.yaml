name: celebration_effect
description: >-
  軽量な祝福演出ライブラリ。紙吹雪やクラッカーなどのパーティクル演出を
  任意のウィジェットにオーバーレイ。5種類の形状・プリセット・風エフェクト・
  自動スケーリング対応。追加パッケージ不要。
version: 2.0.0
homepage: https://github.com/yourname/celebration_effect
repository: https://github.com/yourname/celebration_effect
issue_tracker: https://github.com/yourname/celebration_effect/issues

environment:
  sdk: ^3.8.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - animation
  - confetti
  - celebration
  - flutter

platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:
